<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>찐 맛집 찾기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', sans-serif; display: flex; height: 100vh; }
  #sidebar {
    width: 340px; min-width: 340px; overflow-y: auto;
    border-right: 1px solid #ddd; background: #fafafa; padding: 12px;
  }
  #map { flex: 1; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  #meta { font-size: 12px; color: #888; margin-bottom: 10px; }
  #filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border: 1px solid #ccc;
    border-radius: 12px; background: #fff; cursor: pointer; user-select: none;
  }
  .chip.on { background: #2f6fdd; color: #fff; border-color: #2f6fdd; }
  .item {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
  }
  .item:hover { border-color: #2f6fdd; }
  .item .nm { font-weight: bold; font-size: 14px; }
  .item .sub { font-size: 12px; color: #777; margin-top: 2px; }
  #count { font-size: 13px; margin-bottom: 8px; color: #444; }
  .flabel { font-size: 11px; color: #999; margin: 6px 0 3px; }
  .cattag {
    font-size: 11px; color: #555; background: #eef1f5;
    border-radius: 4px; padding: 1px 6px; margin-left: 4px;
    font-weight: normal; white-space: nowrap;
  }
  #sheetToggle { display: none; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #f59f00; border-top-color: transparent;
    animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 5px;
  }
  #progressHead { font-weight: bold; color: #b06d00; margin-bottom: 4px; }
  .fbtn {
    font-size: 11px; padding: 2px 6px; margin: 2px 1px 0; cursor: pointer;
    border: 1px solid #ccc; border-radius: 10px; background: #fff;
  }
  .fbtn:hover { background: #f1f3f5; }

  /* ---- 모바일: 지도 전체화면 + 하단 시트 ---- */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    #map { order: 1; flex: 1; min-height: 0; }
    #sidebar {
      order: 2; width: 100%; min-width: 0;
      height: 42vh; border-right: none; border-top: 1px solid #ddd;
      transition: height 0.25s ease;
      border-radius: 14px 14px 0 0; box-shadow: 0 -3px 12px rgba(0,0,0,0.12);
    }
    #sidebar.collapsed { height: 15vh; overflow: hidden; }
    #sidebar.expanded { height: 78vh; }
    #sheetToggle {
      display: block; width: 100%; height: 26px; border: none;
      background: transparent; cursor: grab; padding: 0; position: relative;
      touch-action: none;   /* 드래그 중 페이지 스크롤 방지 */
    }
    #sheetToggle::before {
      content: ""; position: absolute; top: 9px; left: 50%;
      transform: translateX(-50%);
      width: 44px; height: 5px; border-radius: 3px; background: #ccc;
    }
    #sidebar.dragging { transition: none; }   /* 드래그 중엔 애니메이션 끔 */
    h1 { font-size: 16px; }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <button id="sheetToggle" aria-label="패널 크기 전환"></button>
    <h1>🍚 찐 맛집 찾기</h1>
    <div id="searchRow" style="display:flex;gap:4px;margin:6px 0 2px;">
      <input id="q" placeholder="새 지역 검색 (예: 성수역, 가로수길)"
             style="flex:1;padding:5px;font-size:13px;">
      <button id="qBtn" style="padding:5px 10px;cursor:pointer;">검색</button>
    </div>
    <div id="requestRow" style="display:none;margin:4px 0;font-size:13px;"></div>
    <div id="qResults"></div>
    <div id="collectPanel" style="display:none;background:#e7f5ff;border-radius:6px;
         padding:8px;margin:4px 0;font-size:13px;">
      <div id="collectTarget" style="font-weight:bold;margin-bottom:4px;"></div>
      반경
      <select id="radiusPreset" style="padding:2px;">
        <option value="100">100m</option>
        <option value="300" selected>300m</option>
        <option value="500">500m</option>
        <option value="1000">1km</option>
        <option value="custom">직접 입력</option>
      </select>
      <input id="radiusInput" type="number" value="300" min="50" max="2000" step="50"
             style="width:70px;padding:2px;display:none;"> <span id="radiusUnit" style="display:none;">m</span>
      <button id="collectBtn" style="margin-left:6px;padding:3px 10px;cursor:pointer;">수집 시작</button>
    </div>
    <div id="progress" style="display:none;background:#fff9db;border-radius:6px;
         padding:8px;margin:4px 0;font-size:12px;white-space:pre-wrap;
         max-height:180px;overflow-y:auto;font-family:consolas,monospace;
         resize:vertical;"></div>
    <select id="regionSel" style="width:100%;padding:5px;margin:6px 0;font-size:14px;"></select>
    <div id="meta"></div>
    <div class="flabel">판정 필터</div>
    <div id="verdicts" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;"></div>
    <div class="flabel">분류 필터 (판정과 동시 적용)</div>
    <div id="filters"></div>
    <div id="count"></div>
    <div id="list"></div>
  </div>
  <div id="map"></div>

  <script>window.STATIC_MODE = true; window.REQUEST_FORM_URL = ""; window.FEEDBACK_ENDPOINT = ""; window.REGION_ENDPOINT = "";</script>
  <script src="mapkey.js"></script>
  <script>
    document.write('<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey='
      + window.KAKAO_JS_KEY + '&libraries=clusterer&autoload=false"><\/script>');
  </script>
  <script src="app.js?v=1783325736"></script>
</body>
</html>
